<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLA - Pole Line Analysis</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
    }
    </script>
    <style>
        .hero { background: linear-gradient(135deg, #1e3a5f, #0f172a); color: #fff; padding: 2rem; text-align: center; }
        .stats { display: flex; justify-content: center; gap: 3rem; margin-top: 1rem; flex-wrap: wrap; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #60a5fa; }
        .stat-lbl { font-size: 0.75rem; opacity: 0.7; }
        #viewer { height: 400px; background: #1a1a2e; border-radius: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-row { margin-bottom: 0.5rem; }
        .form-row label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .result { background: #f0f0f0; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; margin-top: 1rem; }
        #llm-out { min-height: 100px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="topnav">
        <a href="../" class="logo">🔌 PLA</a>
        <div class="nav-links">
            <a href="./">App</a>
            <a href="core/">Core</a>
            <a href="viz/">Viz</a>
            <a href="analysis/">Analysis</a>
            <a href="sandbox/">Sandbox</a>
            <a href="docs/">Docs</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Pole Line Analysis</h1>
        <p>3D Engineering | WebGPU + CPU Compute | No Server</p>
        <div class="stats">
            <div><div class="stat-val" id="gpu-status">...</div><div class="stat-lbl">Compute</div></div>
            <div><div class="stat-val">16-dim</div><div class="stat-lbl">FemtoLLM</div></div>
            <div><div class="stat-val">1000³</div><div class="stat-lbl">Grid</div></div>
        </div>
    </div>

    <main>
        <h2>3D Viewer</h2>
        <div id="viewer"></div>
        <div style="margin-top:1rem">
            <button class="btn" onclick="resetCam()">Reset</button>
            <button class="btn" onclick="addPole()">Add Pole</button>
            <button class="btn" onclick="toggleWire()">Wireframe</button>
        </div>

        <h2 style="margin-top:2rem">Analysis Tools</h2>
        <div class="grid-2">
            <div class="card">
                <h3>Catenary Calculator</h3>
                <div class="form-row"><label>Span (m)</label><input type="number" id="span" value="50"></div>
                <div class="form-row"><label>Sag (m)</label><input type="number" id="sag" value="2.5"></div>
                <div class="form-row"><label>Weight (kg/m)</label><input type="number" id="wt" value="1.5"></div>
                <button class="btn" onclick="calcCat()">Calculate</button>
                <div class="result" id="cat-out"></div>
            </div>
            <div class="card">
                <h3>Pole Loading</h3>
                <div class="form-row"><label>Height (ft)</label><input type="number" id="ph" value="45"></div>
                <div class="form-row"><label>Class</label><select id="pc"><option>2</option><option>3</option><option>1</option><option>H1</option></select></div>
                <div class="form-row"><label>Wind Span (ft)</label><input type="number" id="ws" value="300"></div>
                <button class="btn" onclick="calcPole()">Analyze</button>
                <div class="result" id="pole-out"></div>
            </div>
        </div>

        <h2 style="margin-top:2rem">AI Assistant</h2>
        <div class="card">
            <input type="text" id="llm-in" placeholder="Ask about pole analysis..." style="width:calc(100% - 90px)">
            <button class="btn" onclick="askLLM()">Ask</button>
            <div class="result" id="llm-out"></div>
        </div>
    </main>

    <script type="module">
        import { PLA } from './core/init.js';
        import { Scene } from './viz/scene.js';
        import { PoleMesh } from './viz/pole-mesh.js';
        import { ConductorMesh } from './viz/conductor-mesh.js';
        import { Controls } from './viz/controls.js';
        import { Catenary } from './analysis/catenary.js';
        import { PoleAnalysis } from './analysis/pole.js';

        let pla, scene, controls;

        async function init() {
            pla = await PLA.init();
            document.getElementById('gpu-status').textContent = pla.gpu ? 'WebGPU' : 'CPU';

            scene = new Scene(document.getElementById('viewer')).init();
            controls = new Controls(scene.camera, scene.renderer.domElement).initOrbit();

            // Demo line
            for (let i = 0; i < 4; i++) {
                const x = (i - 1.5) * 40;
                scene.add(`pole${i}`, PoleMesh.create({ x, height: 12, material: i === 2 ? 'steel' : 'wood' }));
            }
            for (let i = 0; i < 3; i++) {
                const s = { x: (i - 1.5) * 40, y: 10.8, z: 0 };
                const e = { x: (i - 0.5) * 40, y: 10.8, z: 0 };
                scene.add(`span${i}`, ConductorMesh.createPhases(s, e, 1.5, 3, 1));
            }

            scene.animate(() => controls.update());
        }

        window.resetCam = () => controls.reset();
        window.toggleWire = () => scene.scene.traverse(c => { if (c.material) c.material.wireframe = !c.material.wireframe; });
        window.addPole = () => {
            const id = `pole_${Date.now()}`;
            scene.add(id, PoleMesh.create({ x: Math.random() * 100 - 50, z: Math.random() * 100 - 50 }));
        };

        window.calcCat = () => {
            const span = +document.getElementById('span').value;
            const sag = +document.getElementById('sag').value;
            const wt = +document.getElementById('wt').value;
            const cat = new Catenary(span, sag, wt);
            document.getElementById('cat-out').textContent =
                `a: ${cat.a.toFixed(2)}m\nH: ${cat.tension().toFixed(0)}N\nL: ${cat.length().toFixed(2)}m`;
        };

        window.calcPole = () => {
            const pole = new PoleAnalysis({ height: +document.getElementById('ph').value, poleClass: document.getElementById('pc').value });
            pole.addConductor({ windSpan: +document.getElementById('ws').value, height: pole.height - 5 });
            pole.addConductor({ windSpan: +document.getElementById('ws').value, height: pole.height - 7 });
            pole.addConductor({ windSpan: +document.getElementById('ws').value, height: pole.height - 9 });
            pole.addPoleWind();
            document.getElementById('pole-out').textContent = pole.report();
        };

        window.askLLM = async () => {
            const q = document.getElementById('llm-in').value;
            document.getElementById('llm-out').textContent = await pla.ask(q);
        };

        init();
    </script>
</body>
</html>

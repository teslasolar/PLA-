<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLA Designer - Pole Line Analysis</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="root">
        <!-- Left Sidebar - Component Palette -->
        <div class="sidebar">
            <div class="sidebar-title">🔌 PLA Designer</div>
            <input class="input" placeholder="Search components..." id="search" style="margin-bottom: 1rem;">
            <div id="palette">
                <!-- Loaded from palette.json -->
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="main-area">
            <div class="toolbar">
                <button class="btn active" id="selectBtn" onclick="setTool('select')">↖️ Select</button>
                <button class="btn" id="spanBtn" onclick="setTool('span')">〰️ Span</button>
                <button class="btn" id="guyBtn" onclick="setTool('guy')">↘️ Guy</button>
                <div class="toolbar-separator"></div>
                <button class="btn" onclick="toggleView()">🔄 2D/3D</button>
                <button class="btn" onclick="zoomIn()">🔍+</button>
                <button class="btn" onclick="zoomOut()">🔍-</button>
                <button class="btn" onclick="resetView()">↻ Reset</button>
                <div class="toolbar-separator"></div>
                <button class="btn" onclick="runAnalysis()">📊 Analyze</button>
                <button class="btn" onclick="showReport()">📋 Report</button>
                <div style="flex:1"></div>
                <button class="btn success" onclick="saveProject()">💾 Save</button>
                <button class="btn" onclick="loadProject()">📂 Load</button>
                <button class="btn" onclick="exportProject()">📤 Export</button>
            </div>

            <div class="canvas-container">
                <div class="canvas" id="canvas">
                    <div class="grid" id="grid"></div>
                    <div id="viewer3d"></div>
                </div>
            </div>

            <div class="status-bar">
                <span>Poles: <strong id="poleCount">0</strong></span>
                <span>Spans: <strong id="spanCount">0</strong></span>
                <span>Selected: <strong id="selectedName">None</strong></span>
                <span>Tool: <strong id="currentTool">Select</strong></span>
                <span id="status" style="color: #10b981;">Ready</span>
            </div>
        </div>

        <!-- Right Sidebar - Properties -->
        <div class="properties">
            <div class="props-title">⚙️ Properties</div>
            <div id="propsPanel">
                <div style="color: #64748b; text-align: center; padding: 1rem;">
                    Select a component to edit properties
                </div>
            </div>

            <div style="margin-top: 1.5rem;">
                <div class="props-title">📊 Quick Analysis</div>
                <div id="quickAnalysis">
                    <div class="result-card">
                        <div class="result-label">Total Line Length</div>
                        <div class="result-value" id="totalLength">0 ft</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Max Utilization</div>
                        <div class="result-value" id="maxUtil">0%</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Overall Status</div>
                        <div class="result-value pass" id="clearanceStatus">--</div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div class="props-title" style="margin:0;">📄 Project JSON</div>
                    <button class="btn" onclick="copyJSON()" style="font-size:0.7rem; padding:0.25rem 0.5rem;">📋 Copy</button>
                </div>
                <div class="json-box" id="jsonOutput">{}</div>
            </div>
        </div>
    </div>

    <!-- Analysis Modal -->
    <div class="modal" id="analysisModal">
        <div class="modal-content">
            <div class="modal-title">📊 Structural Analysis Report</div>
            <div id="analysisResults"></div>
            <div style="margin-top: 1rem; text-align: right;">
                <button class="btn" onclick="closeModal('analysisModal')">Close</button>
                <button class="btn success" onclick="exportReport()">📤 Export Report</button>
            </div>
        </div>
    </div>

    <!-- Main script loads all modules -->
    <script type="module" src="scripts/main.js"></script>
</body>
</html>

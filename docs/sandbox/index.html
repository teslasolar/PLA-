<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLA Python Sandbox</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        .sandbox { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; height: 70vh; }
        .editor, .output { display: flex; flex-direction: column; background: #1e1e1e; border-radius: 8px; }
        .panel-head { padding: 0.75rem 1rem; background: #333; display: flex; justify-content: space-between; }
        #code { flex: 1; padding: 1rem; border: 0; resize: none; background: #1e1e1e; color: #d4d4d4; font-family: monospace; }
        #out { flex: 1; padding: 1rem; color: #58a6ff; overflow: auto; white-space: pre-wrap; }
        .examples { margin-top: 1rem; }
        .ex-btn { margin: 0.25rem; padding: 0.5rem 1rem; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="topnav">
        <a href="../../" class="logo">🔌 PLA</a>
        <div class="nav-links">
            <a href="../">App</a>
            <a href="../core/">Core</a>
            <a href="../viz/">Viz</a>
            <a href="../analysis/">Analysis</a>
            <a href="./">Sandbox</a>
        </div>
    </nav>
    <main>
        <h1>🐍 Python Sandbox</h1>
        <p id="status">Loading Python...</p>
        <div class="sandbox">
            <div class="editor">
                <div class="panel-head"><span>Python</span><button class="btn" onclick="run()">▶ Run</button></div>
                <textarea id="code">import numpy as np

span = 50  # m
sag = 2.5  # m
a = span / (2 * np.arcsinh(sag * 2 / span))
H = a * 1.5 * 9.81

print(f"Span: {span}m")
print(f"Sag: {sag}m")
print(f"a: {a:.2f}m")
print(f"Tension: {H:.0f}N")</textarea>
            </div>
            <div class="output">
                <div class="panel-head"><span>Output</span><button class="btn" onclick="clear()">Clear</button></div>
                <pre id="out"></pre>
            </div>
        </div>
        <div class="examples">
            <button class="ex-btn" onclick="load('cat')">Catenary</button>
            <button class="ex-btn" onclick="load('wind')">Wind Load</button>
            <button class="ex-btn" onclick="load('pole')">Pole Analysis</button>
        </div>
    </main>
    <script src="sandbox.js"></script>
</body>
</html>

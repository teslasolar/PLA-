                <textarea id="editor">import numpy as np

# PLA Catenary Curve Calculator
class CatenaryCurve:
    def __init__(self, span, sag, weight=1.5):
        """
        Initialize catenary curve
        span: horizontal distance (m)
        sag: maximum vertical sag (m)
        weight: conductor weight (kg/m)
        """
        self.span = span
        self.sag = sag
        self.weight = weight
        self.a = self._calculate_catenary_constant()

    def _calculate_catenary_constant(self):
        # Iterative solution for catenary constant
        return self.span / (2 * np.arcsinh(self.sag * 2 / self.span))

    def get_y(self, x):
        """Get vertical position at horizontal position x"""
        local_x = x - self.span / 2
        return self.a * np.cosh(local_x / self.a) - self.a * np.cosh(self.span / (2 * self.a))

    def get_tension(self):
        """Get horizontal tension (N)"""
        return self.a * self.weight * 9.81

    def get_max_tension(self):
        """Get maximum tension at supports (N)"""
        H = self.get_tension()
        V = self.weight * 9.81 * self.a * np.sinh(self.span / (2 * self.a))
        return np.sqrt(H**2 + V**2)

    def get_length(self):
        """Get conductor arc length (m)"""
        return 2 * self.a * np.sinh(self.span / (2 * self.a))

# Example usage
print("=" * 50)
print("PLA Catenary Analysis")
print("=" * 50)

# Create catenary with 50m span, 2.5m sag
catenary = CatenaryCurve(span=50, sag=2.5, weight=1.5)

print(f"\nParameters:")
print(f"  Span: {catenary.span} m")
print(f"  Sag: {catenary.sag} m")
print(f"  Weight: {catenary.weight} kg/m")
print(f"  Catenary constant (a): {catenary.a:.4f} m")

print(f"\nResults:")
print(f"  Horizontal Tension: {catenary.get_tension():.2f} N")
print(f"  Maximum Tension: {catenary.get_max_tension():.2f} N")
print(f"  Conductor Length: {catenary.get_length():.2f} m")
print(f"  Length increase: {(catenary.get_length() - catenary.span):.4f} m")

# Calculate points
print(f"\nCatenary Points:")
for x in np.linspace(0, 50, 6):
    y = catenary.get_y(x)
    print(f"  x={x:5.1f}m, y={y:7.4f}m")

# Wind load calculations
def wind_pressure(velocity_ms):
    """Calculate wind pressure from velocity (m/s to Pa)"""
    rho = 1.225  # air density kg/m³
    return 0.5 * rho * velocity_ms**2

def wind_force_on_conductor(velocity, diameter_mm, span_m):
    """Calculate wind force on conductor"""
    q = wind_pressure(velocity)
    Cd = 1.0  # drag coefficient for cylinder
    force_per_m = Cd * q * (diameter_mm / 1000)
    return force_per_m * span_m

# Pole structural analysis
class PoleAnalysis:
    POLE_CLASSES = {
        'H1': {'moment': 6400, 'top_circ': 23},
        'H2': {'moment': 8000, 'top_circ': 25},
        '1': {'moment': 4500, 'top_circ': 21},

    def __init__(self, pole_class, height_ft):
        self.pole_class = pole_class
        self.height = height_ft
        self.embed = max(6, height_ft * 0.1 + 2)
        self.height_above_ground = height_ft - self.embed
        self.loads = []

    def add_conductor_load(self, force, height):
        self.loads.append({'force': force, 'height': height})

    def calculate_moment(self):
        return sum(l['force'] * l['height'] for l in self.loads)

    def get_capacity(self):

    def get_utilization(self, overload_factor=2.5):

        capacity = self.get_capacity()
        return (moment * overload_factor / capacity) * 100 if capacity else 0

            ruling: `import numpy as np

# Ruling Span Calculation
def ruling_span(spans):
    """
    Calculate ruling span for a series of spans
    Rs = sqrt(sum(Li^3) / sum(Li))
    """
    sum_cubes = sum(s**3 for s in spans)
    sum_lengths = sum(spans)
    return np.sqrt(sum_cubes / sum_lengths)

def ruling_span_estimate(spans):
    """
    Quick estimate: Se = Avg + (2/3)(Max - Avg)
    """
    avg = np.mean(spans)
    max_span = max(spans)
    return avg + (2/3) * (max_span - avg)

        async function initPyodide() {
            const statusEl = document.getElementById('status');
            const runBtn = document.getElementById('runBtn');

            try {
                pyodide = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
                });

                await pyodide.loadPackage(['numpy']);

                statusEl.textContent = 'Ready';
                statusEl.classList.remove('loading');
                statusEl.classList.add('ready');
                runBtn.disabled = false;

                document.getElementById('output').textContent = 'Python environment ready!\nClick "Run" to execute code.';

            } catch (error) {
                statusEl.textContent = 'Error';
                document.getElementById('output').textContent = `Failed to load Pyodide: ${error.message}`;
            }
        }

        async function runCode() {
            if (!pyodide) {
                document.getElementById('output').textContent = 'Python not ready yet...';
                return;
            }

            const code = document.getElementById('editor').value;
            const output = document.getElementById('output');

            output.textContent = 'Running...\n';
            output.classList.remove('output-error');

            try {
                pyodide.runPython(`
                    import sys
                    from io import StringIO
                    sys.stdout = StringIO()
                    sys.stderr = StringIO()
                `);

                await pyodide.runPythonAsync(code);

                const stdout = pyodide.runPython('sys.stdout.getvalue()');
                const stderr = pyodide.runPython('sys.stderr.getvalue()');

                if (stderr) {
                    output.textContent = stderr;
                    output.classList.add('output-error');
                } else {
                    output.textContent = stdout || '(No output)';
                }

            } catch (error) {
                output.textContent = `Error: ${error.message}`;
                output.classList.add('output-error');
            }
        }

        function clearOutput() {
            document.getElementById('output').textContent = '';
            document.getElementById('output').classList.remove('output-error');
        }

        function loadExample(name) {
            if (EXAMPLES[name]) {
                document.getElementById('editor').value = EXAMPLES[name];
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initPyodide);

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                runCode();
            }
        });
    </script>
